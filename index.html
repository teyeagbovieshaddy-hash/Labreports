<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabReport Mate AI</title><meta name="theme-color" content="#0f766e">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f6f4;--c:#fff;--tx:#0f1f1a;--mu:#5f7a70;--pr:#0f766e;--ln:#d9e6e1;--ac:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1613;--c:#12221d;--tx:#e6f4ef;--mu:#8fb0a4;--pr:#2dd4bf;--ln:#1f3a32;--ac:#a78bfa}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1613;--c:#12221d;--tx:#e6f4ef;--mu:#8fb0a4;--pr:#2dd4bf;--ln:#1f3a32;--ac:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
.w{max-width:760px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#064e3b,#0f766e 60%,#7c3aed);color:#fff;margin:0 -14px 14px;padding:20px 16px;border-radius:0 0 26px 26px}
h1{font-size:21px;margin:0}header p{margin:3px 0 0;font-size:12.5px;opacity:.85}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--c);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
label{display:block;font-size:12px;color:var(--mu);margin-top:9px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin-top:4px}
textarea{min-height:96px;resize:vertical}
button{border:1px solid var(--ln);background:var(--c);color:var(--tx);padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer}
button.p{background:linear-gradient(135deg,#0f766e,#7c3aed);color:#fff;border:0;font-weight:600}
button:disabled{opacity:.5}.r{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.mu{color:var(--mu);font-size:12.5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:5px;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:21px}nav button.on{color:var(--pr);font-weight:700}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--ln);padding:10px 0}
.out{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px}
#t{position:fixed;left:14px;right:14px;bottom:90px;background:#111;color:#fff;border-radius:12px;padding:10px 14px;display:none;z-index:9}
#pr{display:none}
@media print{body{background:#fff;padding:0}.w,nav,#t{display:none!important}#pr{display:block;color:#000;font:12pt "Times New Roman",serif;line-height:1.6}#pr h3{margin:14px 0 2px}}
</style></head><body>
<div class="w"><header><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h1>🧪 LabReport Mate AI</h1><p>Turn your lab notes into a clear, well-structured report</p></div><button id="so" style="display:none;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)" onclick="sb.auth.signOut()">Sign out</button></div></header><div id="v"></div></div>
<nav id="nv"></nav><div id="t"></div><div id="pr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
var T={chem:{n:'Chemistry',s:['Aim','Introduction','Apparatus and reagents','Procedure','Observations and results','Calculations','Discussion','Sources of error','Conclusion']},
phys:{n:'Physics',s:['Aim','Apparatus','Theory','Procedure','Data and results','Analysis and calculations','Uncertainties and errors','Conclusion']},
micro:{n:'Microbiology',s:['Aim','Introduction','Materials and media','Aseptic technique and procedure','Observations and results','Discussion','Safety precautions','Conclusion']},
pharm:{n:'Pharmaceutics',s:['Aim','Introduction','Formula and materials','Method of preparation','Evaluation tests and results','Discussion','Conclusion']}};
var tab='new',cur=blank(),sb=null,me=null,busy=false,imp={in:'',out:'',f:'all'},armed=null;
function $(s){return document.querySelector(s)}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function blank(){return{id:'r'+Date.now().toString(36),tpl:'chem',title:'',name:'',course:'',did:'',res:'',secs:{}}}
function toast(t){var e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},4500)}
async function ai(prompt,json){
  var r=await sb.functions.invoke('ai',{body:{prompt:prompt,json:!!json}});
  if(r.error){var m='The AI could not answer. Try again.';try{var b=await r.error.context.json();m=b.error||m}catch(e){}throw new Error(m)}
  if(r.data&&r.data.error)throw new Error(r.data.error);return (r.data.text||'').trim()}
async function list(){var q=await sb.from('reports').select('*').order('at',{ascending:false});if(q.error){toast(q.error.message);return[]}return q.data.map(function(x){return Object.assign({id:x.id,title:x.title,tpl:x.tpl,at:x.at},x.data||{})})}
async function put(r){var q=await sb.from('reports').upsert({id:r.id,title:r.title,tpl:r.tpl,at:r.at,data:{name:r.name,course:r.course,did:r.did,res:r.res,secs:r.secs}});if(q.error)throw new Error(q.error.message)}
async function rm(id){await sb.from('reports').delete().eq('id',id)}
function go(t){tab=t;render()}
function nav(){var n=[['new','📝','New report'],['imp','✨','Improve'],['my','💾','My reports']];$('#nv').innerHTML=n.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
function sync(e){cur[e.dataset.k]=e.value}
function syncS(e){cur.secs[e.dataset.k]=e.value}
function newV(){
  var opts=Object.keys(T).map(function(k){return '<option value="'+k+'"'+(cur.tpl===k?' selected':'')+'>'+T[k].n+'</option>'}).join('');
  var h='<div class="c"><h2>1. Your experiment</h2><label>Template</label><select data-k="tpl" onchange="sync(this);render()">'+opts+'</select><label>Experiment title</label><input data-k="title" value="'+esc(cur.title)+'" oninput="sync(this)"><label>Your name (optional)</label><input data-k="name" value="'+esc(cur.name)+'" oninput="sync(this)"><label>Course (optional)</label><input data-k="course" value="'+esc(cur.course)+'" oninput="sync(this)"><label>What I did in the lab</label><textarea data-k="did" oninput="sync(this)" placeholder="Describe your procedure step by step, in your own words">'+esc(cur.did)+'</textarea><label>My observations and results</label><textarea data-k="res" oninput="sync(this)" placeholder="Include your real readings, measurements and observations">'+esc(cur.res)+'</textarea><div class="r"><button class="p" id="dr" onclick="draft()"'+(busy?' disabled':'')+'>'+(busy?'Drafting…':'✨ Draft with AI')+'</button></div><p class="mu">The AI only uses what you write here. It will not invent results. Check every number against your own lab notes.</p></div>';
  if(Object.keys(cur.secs).length){h+='<div class="c"><h2>2. Edit your report</h2>'+T[cur.tpl].s.map(function(s,i){return '<label><b>'+s+'</b></label><textarea data-k="'+esc(s)+'" oninput="syncS(this)" style="min-height:120px">'+esc(cur.secs[s])+'</textarea><div class="r" style="margin-top:4px"><button onclick="fix('+i+')">Improve this part</button></div>'}).join('')+'<div class="r"><button class="p" onclick="save()">💾 Save</button><button onclick="pdf()">📄 Download PDF</button><button onclick="prt()">🖨️ Print</button></div></div>'}
  return h}
async function draft(){
  if(!cur.did.trim()&&!cur.res.trim()){toast('Add what you did and your results first.');return}
  busy=true;render();var names=T[cur.tpl].s;
  var p='You are helping a pharmacy student at a university in Ghana write a laboratory report ('+T[cur.tpl].n+'). Experiment title: '+cur.title+'\nWhat the student did:\n'+cur.did+'\nStudent observations and results:\n'+cur.res+'\n\nRules: use ONLY facts, numbers and observations given above. Never invent measurements, results, chemicals, references or citations. Where something needed is missing write [add your data: ...]. Write formal British English, past tense, passive voice, clear short paragraphs. In the Introduction explain general background without citing specific sources. Return ONLY a JSON object whose keys are exactly these section names: '+JSON.stringify(names)+' and whose values are the text for each section.';
  try{var j=JSON.parse((await ai(p,true)).replace(/^```(json)?|```$/g,''));cur.secs={};names.forEach(function(n){var v=j[n];cur.secs[n]=typeof v==='string'?v:v?JSON.stringify(v):''});toast('Draft ready. Review and edit each part.')}catch(e){toast('Could not draft: '+(e.message||'try again'))}
  busy=false;render()}
async function fix(i){
  var n=T[cur.tpl].s[i];
  var t=(cur.secs[n]||'').trim();if(!t){toast('Write something in this part first.');return}
  toast('Improving…');
  try{var r=await ai('Improve the grammar, clarity and structure of this '+n+' section of a lab report. Keep every fact and number exactly as written, do not add new facts or citations. Formal British English, past tense. Return only the improved text.\n\n'+t);cur.secs[n]=r;render();toast('Improved.')}catch(e){toast('Could not improve: '+(e.message||'try again'))}}
function impV(){
  var o=[['all','Grammar, clarity and structure'],['gram','Grammar only'],['clar','Clarity only'],['struc','Structure only']].map(function(x){return '<option value="'+x[0]+'"'+(imp.f===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('');
  return '<div class="c"><h2>Improve my writing</h2><p class="mu">Paste a paragraph or section. Your facts and numbers stay exactly as you wrote them.</p><label>Focus</label><select onchange="imp.f=this.value">'+o+'</select><label>My text</label><textarea id="it" style="min-height:160px" oninput="imp.in=this.value">'+esc(imp.in)+'</textarea><div class="r"><button class="p" onclick="improve()"'+(busy?' disabled':'')+'>'+(busy?'Working…':'✨ Improve')+'</button></div>'+(imp.out?'<div class="out">'+esc(imp.out)+'</div><div class="r"><button onclick="navigator.clipboard&&navigator.clipboard.writeText(imp.out.split(\'\\nChanges:\')[0]).then(function(){toast(\'Copied\')})">Copy improved text</button></div>':'')+'</div>'}
async function improve(){
  if(!imp.in.trim()){toast('Paste some text first.');return}
  var fo={all:'grammar, clarity and structure',gram:'grammar and spelling only',clar:'clarity and word choice only',struc:'structure and flow only'}[imp.f];
  busy=true;render();
  try{var r=await ai('Improve this student lab-report text for '+fo+'. Rules: keep every fact, number, unit and observation exactly as written; do not add new facts, results or citations; formal British English. Reply with the improved text, then a blank line, then "Changes:" followed by up to 4 short bullet points saying what you changed.\n\n'+imp.in);imp.out=r}catch(e){toast('Could not improve: '+(e.message||'try again'))}
  busy=false;render()}
async function myV(){
  var l=(await list()).sort(function(a,b){return (b.at||0)-(a.at||0)});
  return '<div class="c"><h2>My reports</h2>'+(l.length?l.map(function(r){return '<div class="it"><div style="min-width:0"><b>'+esc(r.title||'Untitled report')+'</b><div class="mu">'+esc((T[r.tpl]||{}).n||'')+' · '+new Date(r.at||Date.now()).toLocaleDateString()+'</div></div><div class="r" style="margin:0"><button onclick="openR(\''+r.id+'\')">Open</button><button onclick="delR(\''+r.id+'\')">'+(armed===r.id?'Sure?':'Delete')+'</button></div></div>'}).join(''):'<p class="mu">No saved reports yet. Write one and tap Save.</p>')+'<p class="mu">'+'Saved privately to your account.'+'</p></div>'}
async function openR(id){var r=(await list()).filter(function(x){return x.id===id})[0];if(r){cur=Object.assign(blank(),r);cur.secs=r.secs||{};tab='new';render()}}
async function delR(id){if(armed!==id){armed=id;render();return}armed=null;await rm(id);render()}
async function save(){cur.at=Date.now();if(!cur.title)cur.title='Untitled report';try{await put(JSON.parse(JSON.stringify(cur)));toast('Saved to My reports.')}catch(e){toast('Could not save.')}}
function body(){var h='<h2 style="text-align:center">'+esc(cur.title||'Lab report')+'</h2>'+[cur.name,cur.course].filter(Boolean).map(function(x){return '<p style="text-align:center;margin:0">'+esc(x)+'</p>'}).join('');T[cur.tpl].s.forEach(function(s){if((cur.secs[s]||'').trim())h+='<h3>'+s+'</h3>'+cur.secs[s].split('\n').filter(function(x){return x.trim()}).map(function(x){return '<p style="margin:0 0 6px">'+esc(x)+'</p>'}).join('')});return h}
function prt(){$('#pr').innerHTML=body();try{window.print()}catch(e){toast('Printing is blocked here. Use Download PDF.')}}
async function pdf(){
  var J=window.jspdf;if(!J){prt();return}
  var d=new J.jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),y=64;
  function ln(t,sz,b,c){d.setFont('times',b?'bold':'normal');d.setFontSize(sz);d.splitTextToSize(t,W-110).forEach(function(l){if(y>780){d.addPage();y=64}c?d.text(l,W/2,y,{align:'center'}):d.text(l,55,y);y+=sz*1.55})}
  ln(cur.title||'Lab report',16,1,1);[cur.name,cur.course].filter(Boolean).forEach(function(x){ln(x,12,0,1)});y+=10;
  T[cur.tpl].s.forEach(function(s){var t=(cur.secs[s]||'').trim();if(!t)return;y+=6;ln(s,12.5,1);t.split('\n').filter(function(x){return x.trim()}).forEach(function(p){ln(p,11.5,0);y+=3})});
  var fn=((cur.title||'lab-report').replace(/[^\w ]/g,'').trim()||'lab-report')+'.pdf';
  try{d.save(fn);toast('PDF ready.')}catch(e){toast('Could not save the PDF. Tap Print and choose Save as PDF.')}}
function authV(){nav();$('#nv').innerHTML='';$('#so').style.display='none';$('#v').innerHTML='<div class="c"><h2>Sign in</h2><p class="mu">Create a free account with your email to start. Your reports are private to you.</p><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password (at least 6 characters)</label><input id="pw" type="password" autocomplete="current-password"><div class="r"><button class="p" onclick="login()">Sign in</button><button onclick="signup()">Create account</button></div></div>'}
async function login(){var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)toast(r.error.message);else start(r.data.user)}
async function signup(){var r=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)toast(r.error.message);else if(r.data.session)start(r.data.user);else toast('Check your email to confirm your account, then sign in.')}
function start(u){me=u;$('#so').style.display='';render()}
async function render(){if(!me)return authV();nav();var v=tab==='new'?newV():tab==='imp'?impV():await myV();$('#v').innerHTML=v;$('#v').insertAdjacentHTML('beforeend','<p class="mu" style="text-align:center">Free AI tier: Google may use your text to improve its products. Do not type personal details.</p>')}
async function init(){if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.indexOf('PASTE')===0){$('#v').innerHTML='<div class="c"><h2>Setup needed</h2><p>Open config.js and paste your Supabase project URL and key.</p></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT'){me=null;render()}});
  var s=await sb.auth.getSession();if(s.data.session)start(s.data.session.user);else authV()}
init();
</script></body></html>
<script src="fix.js"></script>
